name: CI/CD Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: test

    env:
      SERVER_APP_DIR: ${{ vars.SERVER_APP_DIR }}
      BACKEND_SERVICE_NAME: ${{ vars.BACKEND_SERVICE_NAME }}
      FRONTEND_WEB_ROOT: ${{ vars.FRONTEND_WEB_ROOT }}
      REPOSITORY_URL: https://github.com/${{ github.repository }}.git

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        run: |
          APP_DIR_VALUE="${SERVER_APP_DIR:-}"
          BACKEND_SERVICE_VALUE="${BACKEND_SERVICE_NAME:-}"
          FRONTEND_WEB_ROOT_VALUE="${FRONTEND_WEB_ROOT:-}"
          REPOSITORY_URL_VALUE="$REPOSITORY_URL"
          APP_DIR_ESCAPED="$(printf '%q' "$APP_DIR_VALUE")"
          BACKEND_SERVICE_ESCAPED="$(printf '%q' "$BACKEND_SERVICE_VALUE")"
          FRONTEND_WEB_ROOT_ESCAPED="$(printf '%q' "$FRONTEND_WEB_ROOT_VALUE")"
          REPOSITORY_URL_ESCAPED="$(printf '%q' "$REPOSITORY_URL_VALUE")"

          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "SERVER_APP_DIR=$APP_DIR_ESCAPED BACKEND_SERVICE_NAME=$BACKEND_SERVICE_ESCAPED FRONTEND_WEB_ROOT=$FRONTEND_WEB_ROOT_ESCAPED REPOSITORY_URL=$REPOSITORY_URL_ESCAPED bash -se" <<'REMOTE'
          set -euo pipefail

          APP_DIR="${SERVER_APP_DIR:-/opt/financial-dashboard}"
          BACKEND_SERVICE="${BACKEND_SERVICE_NAME:-financial-dashboard-backend}"
          FRONTEND_ROOT="${FRONTEND_WEB_ROOT:-}"

          ensure_command() {
            if ! command -v "$1" >/dev/null 2>&1; then
              echo "Missing required command: $1" >&2
              exit 127
            fi
          }

          load_node_runtime() {
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              # nvm is often installed for interactive shells only; GitHub SSH runs a non-interactive shell.
              . "$NVM_DIR/nvm.sh"
              if [ -f "$APP_DIR/frontend/.nvmrc" ]; then
                nvm use --silent "$(cat "$APP_DIR/frontend/.nvmrc")" >/dev/null
              elif [ -f "$APP_DIR/.nvmrc" ]; then
                nvm use --silent "$(cat "$APP_DIR/.nvmrc")" >/dev/null
              fi
            fi
          }

          if [ ! -d "$APP_DIR/.git" ]; then
            sudo install -d -o "$USER" -g "$USER" "$APP_DIR"
            git clone "$REPOSITORY_URL" "$APP_DIR"
          fi

          cd "$APP_DIR"

          git fetch origin main
          git reset --hard origin/main

          if [ ! -f "$APP_DIR/.db.env" ] && [ ! -f "$APP_DIR/backend/.db.env" ]; then
            echo "Missing database env file. Create $APP_DIR/.db.env or $APP_DIR/backend/.db.env on the server." >&2
            exit 1
          fi

          load_node_runtime
          ensure_command node
          ensure_command npm

          cd "$APP_DIR/frontend"
          npm ci
          npm run build
          if [ -z "$FRONTEND_ROOT" ]; then
            if [ -d /var/www/financial-dashboard ]; then
              FRONTEND_ROOT=/var/www/financial-dashboard
            elif [ -d /var/www/html ]; then
              FRONTEND_ROOT=/var/www/html
            else
              FRONTEND_ROOT="$APP_DIR/frontend/dist"
            fi
          fi
          sudo install -d -o "$USER" -g "$USER" "$FRONTEND_ROOT"
          sudo rm -rf "$FRONTEND_ROOT/assets"
          sudo cp -R "$APP_DIR/frontend/dist/." "$FRONTEND_ROOT/"

          cd "$APP_DIR/backend"
          if [ ! -d .venv ]; then
            python3 -m venv .venv
          fi
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

          sudo systemctl restart "$BACKEND_SERVICE"
          sudo nginx -t
          sudo systemctl reload nginx
          REMOTE
