name: CI/CD Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: test

    env:
      SERVER_APP_DIR: ${{ vars.SERVER_APP_DIR }}
      BACKEND_SERVICE_NAME: ${{ vars.BACKEND_SERVICE_NAME }}
      FRONTEND_WEB_ROOT: ${{ vars.FRONTEND_WEB_ROOT }}
      RSS_INGEST_TIMER_NAME: ${{ vars.RSS_INGEST_TIMER_NAME }}
      SECOND_BRAIN_PATH: ${{ vars.SECOND_BRAIN_PATH }}
      REPOSITORY_URL: https://github.com/${{ github.repository }}.git

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        run: |
          APP_DIR_VALUE="${SERVER_APP_DIR:-}"
          BACKEND_SERVICE_VALUE="${BACKEND_SERVICE_NAME:-}"
          FRONTEND_WEB_ROOT_VALUE="${FRONTEND_WEB_ROOT:-}"
          RSS_INGEST_TIMER_VALUE="${RSS_INGEST_TIMER_NAME:-}"
          SECOND_BRAIN_PATH_VALUE="${SECOND_BRAIN_PATH:-}"
          REPOSITORY_URL_VALUE="$REPOSITORY_URL"
          APP_DIR_ESCAPED="$(printf '%q' "$APP_DIR_VALUE")"
          BACKEND_SERVICE_ESCAPED="$(printf '%q' "$BACKEND_SERVICE_VALUE")"
          FRONTEND_WEB_ROOT_ESCAPED="$(printf '%q' "$FRONTEND_WEB_ROOT_VALUE")"
          RSS_INGEST_TIMER_ESCAPED="$(printf '%q' "$RSS_INGEST_TIMER_VALUE")"
          SECOND_BRAIN_PATH_ESCAPED="$(printf '%q' "$SECOND_BRAIN_PATH_VALUE")"
          REPOSITORY_URL_ESCAPED="$(printf '%q' "$REPOSITORY_URL_VALUE")"

          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "SERVER_APP_DIR=$APP_DIR_ESCAPED BACKEND_SERVICE_NAME=$BACKEND_SERVICE_ESCAPED FRONTEND_WEB_ROOT=$FRONTEND_WEB_ROOT_ESCAPED RSS_INGEST_TIMER_NAME=$RSS_INGEST_TIMER_ESCAPED SECOND_BRAIN_PATH=$SECOND_BRAIN_PATH_ESCAPED REPOSITORY_URL=$REPOSITORY_URL_ESCAPED bash -se" <<'REMOTE'
          set -euo pipefail

          APP_DIR="${SERVER_APP_DIR:-/opt/financial-dashboard}"
          BACKEND_SERVICE="${BACKEND_SERVICE_NAME:-financial-dashboard-backend}"
          FRONTEND_ROOT="${FRONTEND_WEB_ROOT:-}"
          RSS_TIMER="${RSS_INGEST_TIMER_NAME:-financial-dashboard-rss-ingest}"
          SECOND_BRAIN="${SECOND_BRAIN_PATH:-/root/.openclaw/second-brain}"
          RSS_SERVICE="${RSS_TIMER}.service"
          RSS_TIMER_UNIT="${RSS_TIMER}.timer"

          ensure_command() {
            if ! command -v "$1" >/dev/null 2>&1; then
              echo "Missing required command: $1" >&2
              exit 127
            fi
          }

          load_node_runtime() {
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              # nvm is often installed for interactive shells only; GitHub SSH runs a non-interactive shell.
              . "$NVM_DIR/nvm.sh"
              if [ -f "$APP_DIR/frontend/.nvmrc" ]; then
                nvm use --silent "$(cat "$APP_DIR/frontend/.nvmrc")" >/dev/null
              elif [ -f "$APP_DIR/.nvmrc" ]; then
                nvm use --silent "$(cat "$APP_DIR/.nvmrc")" >/dev/null
              fi
            fi
          }

          if [ ! -d "$APP_DIR/.git" ]; then
            sudo install -d -o "$USER" -g "$USER" "$APP_DIR"
            git clone "$REPOSITORY_URL" "$APP_DIR"
          fi

          cd "$APP_DIR"

          git fetch origin main
          git reset --hard origin/main

          if [ ! -f "$APP_DIR/.db.env" ] && [ ! -f "$APP_DIR/backend/.db.env" ]; then
            echo "Missing database env file. Create $APP_DIR/.db.env or $APP_DIR/backend/.db.env on the server." >&2
            exit 1
          fi
          if [ ! -f "$APP_DIR/.rss" ]; then
            echo "Missing RSS source file. Create $APP_DIR/.rss on the server; it is intentionally not committed." >&2
            exit 1
          fi
          if [ ! -d "$SECOND_BRAIN/wiki/analyses" ] || [ ! -d "$SECOND_BRAIN/wiki/html" ]; then
            echo "Missing second-brain wiki directories under $SECOND_BRAIN." >&2
            exit 1
          fi
          ANALYSES_COUNT="$(find "$SECOND_BRAIN/wiki/analyses" -maxdepth 1 -type f -name '*.md' | wc -l | tr -d ' ')"
          HTML_COUNT="$(find "$SECOND_BRAIN/wiki/html" -maxdepth 1 -type f -name '*.html' | wc -l | tr -d ' ')"
          echo "Second-brain analyses markdown files: $ANALYSES_COUNT"
          echo "Second-brain HTML artifact files: $HTML_COUNT"
          find "$SECOND_BRAIN/wiki/html" -maxdepth 1 -type f -name '*.html' -printf 'Second-brain HTML artifact: %f\n'
          for analysis_file in "$SECOND_BRAIN"/wiki/analyses/*.md; do
            [ -e "$analysis_file" ] || continue
            echo "Second-brain analysis frontmatter: $(basename "$analysis_file")"
            sed -n '1,/^---$/p' "$analysis_file" | grep -E '^(type|frontend_category|event_tags|artifact_html):' || true
          done
          touch "$APP_DIR/.env"
          chmod 600 "$APP_DIR/.env"
          if grep -q '^FD_SECOND_BRAIN_PATH=' "$APP_DIR/.env"; then
            sed -i "s|^FD_SECOND_BRAIN_PATH=.*|FD_SECOND_BRAIN_PATH=$SECOND_BRAIN|" "$APP_DIR/.env"
          else
            printf '\nFD_SECOND_BRAIN_PATH=%s\n' "$SECOND_BRAIN" >> "$APP_DIR/.env"
          fi

          load_node_runtime
          ensure_command node
          ensure_command npm

          cd "$APP_DIR/frontend"
          npm ci
          npm run build
          if [ -z "$FRONTEND_ROOT" ]; then
            if [ -d /var/www/financial-dashboard ]; then
              FRONTEND_ROOT=/var/www/financial-dashboard
            elif [ -d /var/www/html ]; then
              FRONTEND_ROOT=/var/www/html
            else
              FRONTEND_ROOT="$APP_DIR/frontend/dist"
            fi
          fi
          sudo install -d -o "$USER" -g "$USER" "$FRONTEND_ROOT"
          sudo rm -rf "$FRONTEND_ROOT/assets"
          sudo cp -R "$APP_DIR/frontend/dist/." "$FRONTEND_ROOT/"

          cd "$APP_DIR/backend"
          if [ ! -d .venv ]; then
            python3 -m venv .venv
          fi
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/python - <<'PY'
          from app.core.config import get_settings

          settings = get_settings()
          print(f"Backend settings second_brain_path: {settings.second_brain_path}")
          PY
          FD_SECOND_BRAIN_PATH="$SECOND_BRAIN" .venv/bin/python - <<'PY'
          import os
          from app.services.entity_dynamics_service import EntityDynamicsService

          class EmptyRepository:
            pass

          service = EntityDynamicsService(os.environ["FD_SECOND_BRAIN_PATH"], EmptyRepository())
          items = service._load_deep_dive("all", None)
          print(f"Second-brain parsed deep-dive items: {len(items)}")
          for path in sorted(service._analyses_dir.glob("*.md")):
            print(f"Second-brain parsed analysis {path.name}: {service._parse_analysis_item(path) is not None}")
          PY

          sudo tee "/etc/systemd/system/$RSS_SERVICE" >/dev/null <<SERVICE
          [Unit]
          Description=Financial Dashboard RSS intelligence ingest
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          WorkingDirectory=$APP_DIR
          ExecStart=/bin/bash -lc 'set -euo pipefail; cd "$APP_DIR"; if [ -f .db.env ]; then set -a; . ./.db.env; set +a; elif [ -f backend/.db.env ]; then set -a; . ./backend/.db.env; set +a; fi; backend/.venv/bin/python backend/scripts/ingest_rss_sources.py'
          SERVICE

          sudo tee "/etc/systemd/system/$RSS_TIMER_UNIT" >/dev/null <<TIMER
          [Unit]
          Description=Run Financial Dashboard RSS intelligence ingest hourly

          [Timer]
          OnBootSec=5min
          OnUnitActiveSec=1h
          Persistent=true
          Unit=$RSS_SERVICE

          [Install]
          WantedBy=timers.target
          TIMER

          sudo systemctl daemon-reload
          sudo systemctl enable --now "$RSS_TIMER_UNIT"

          sudo install -d "/etc/systemd/system/$BACKEND_SERVICE.service.d"
          sudo tee "/etc/systemd/system/$BACKEND_SERVICE.service.d/second-brain.conf" >/dev/null <<SERVICE_ENV
          [Service]
          Environment=FD_SECOND_BRAIN_PATH=$SECOND_BRAIN
          SERVICE_ENV
          sudo systemctl daemon-reload
          systemctl show "$BACKEND_SERVICE" -p Environment --no-pager
          systemctl show "$BACKEND_SERVICE" -p FragmentPath -p DropInPaths -p ExecStart -p WorkingDirectory -p MainPID --no-pager
          sudo systemctl cat "$BACKEND_SERVICE"

          sudo systemctl restart "$BACKEND_SERVICE"
          sleep 2
          BACKEND_PID="$(systemctl show "$BACKEND_SERVICE" -p MainPID --value)"
          echo "Backend service MainPID after restart: $BACKEND_PID"
          if [ "$BACKEND_PID" != "0" ] && [ -r "/proc/$BACKEND_PID/environ" ]; then
            echo "Backend process second-brain env:"
            sudo tr '\0' '\n' <"/proc/$BACKEND_PID/environ" | grep -E '^(FD_SECOND_BRAIN_PATH|SECOND_BRAIN_PATH)=' || true
            echo "Backend process cwd:"
            sudo readlink -f "/proc/$BACKEND_PID/cwd" || true
          fi
          if command -v curl >/dev/null 2>&1; then
            echo "Local backend Deep Dive response:"
            curl -fsS 'http://127.0.0.1:8000/api/v1/entity-dynamics/feed?channel=deep_dive&filter=close_reading&limit=3' | head -c 500 || true
            echo
          fi
          sudo nginx -t
          sudo systemctl reload nginx
          REMOTE
